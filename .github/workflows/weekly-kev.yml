name: CISA KEV Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-kev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run KEV tracker
        run: python kev_tracker.py

      - name: Commit updated state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kev_state.json reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update CISA KEV report"
            git push
          else
            echo "No report changes to commit"
          fi
